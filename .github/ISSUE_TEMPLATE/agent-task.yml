name: Agent task
description: A task small and specific enough for a factory agent (size S or M)
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: "One or two sentences of user-visible outcome" }
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes: { label: Acceptance criteria, description: "A checklist; every item testable", value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: proof
    attributes: { label: How to prove it, description: "Which unit/e2e test, which screenshots (desktop, iOS)" }
    validations: { required: true }
  - type: textarea
    id: areas
    attributes: { label: Areas touched, description: "Area (frontend, rust-core, mobile, infra, radio) and files likely involved" }
    validations: { required: true }
  - type: textarea
    id: deps
    attributes: { label: Depends on, description: "Issue numbers that must be closed first, e.g. #60" }
