name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (format, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads the channel and components from rust-toolchain.toml
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p peoples-chat-core --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p peoples-chat-core

  app:
    name: App (front end and shell build check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Front-end type check
        run: pnpm check
      - name: Front-end tests
        run: pnpm test
      - name: Front-end build
        run: pnpm build
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Shell clippy
        run: cargo clippy -p peoples-chat --all-targets -- -D warnings
