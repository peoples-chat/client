[package]
name = "peoples-chat"
description = "peoples.chat app shell: hosts the web view and the Rust core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which Windows needs:
# https://github.com/rust-lang/cargo/issues/8519
name = "peoples_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
peoples-chat-core = { path = "../core" }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# generate_context! embeds the plugins' configuration (tauri.conf.json) as JSON values.
serde_json = "1"
# The device unlock before the account key is exported (#86). Android, iOS and macOS; elsewhere
# the export says the device can't be unlocked.
tauri-plugin-biometric = "2"
# Tauri's async runtime, built here with larger worker stacks for MDK, and the core's slot.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# The system share sheet (#66), a plugin of this app.
tauri-plugin-share-sheet = { path = "plugins/share-sheet" }
# Opens https://peoples.chat/i links in the app: Android App Links and iOS universal links (#72).
tauri-plugin-deep-link = "2"
