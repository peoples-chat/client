[package]
name = "peoples-chat-core"
description = "Protocol core of peoples.chat: identity, messaging, radio transports and recovery"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# MDK, the Marmot Development Kit, through its multi-account app runtime. All three come from
# one release tag; Cargo.lock records the commit. Upgrade routine: docs/mdk.md.
marmot-app = { git = "https://github.com/marmot-protocol/mdk", tag = "v0.18.0" }
marmot-account = { git = "https://github.com/marmot-protocol/mdk", tag = "v0.18.0" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", tag = "v0.18.0" }
# The radio transport interface (src/radio) is a trait object, so its async methods are boxed.
async-trait = "0.1"
# Chat ids are MLS group ids in hex.
hex = "0.4"
# The radio message format (#39): ChaCha20-Poly1305 packets that travel as base64. MDK's
# dependencies already bring in these versions.
base64 = "0.22"
chacha20poly1305 = "0.10"
# Names of kept photos (#94). MDK's dependencies already bring in this version.
sha2 = "0.10"
# Profile photos (#94): decoded, turned upright, cut square and saved again as JPEG, which drops
# their metadata. MDK already builds this version with these formats.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Fetches photos from a media server on this machine, in tests and debug builds; everything else
# goes through MDK's own safe download. MDK already builds this version.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zeroize = "1"
# Radio keys (#128), and the invitations the user sent (#95): random tokens, kept as JSON in the data folder. MDK's
# dependencies already bring in these versions.
rand = "0.8"
serde_json = "1"
log = "0.4"
# Reads the relay hints in invite links (NIP-19 nprofile), and the tests read exported keys back
# (NIP-49). The same fork, revision and features MDK uses, so it adds nothing to the build.
nostr = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589", default-features = false, features = ["std", "nip49"] }
# The interface's types travel as JSON (src/interface.rs).
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

# MeshCore's companion protocol (#60; MIT). On desktops it reaches radios over USB serial, which
# brings in the serialport crate (MPL-2.0). Phones build it without a link of its own: they will
# reach radios over Bluetooth (#23). Notes: docs/radio.md.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
meshcore-rs = { version = "=0.2.0", default-features = false, features = ["serial"] }
# Lists the USB serial ports a radio can be paired on (#24). meshcore-rs uses the same crate.
tokio-serial = { version = "5.5", default-features = false }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
meshcore-rs = { version = "=0.2.0", default-features = false }

[dev-dependencies]
# Replaces the OS keychain in tests.
keyring-core = "1"
# Fake companion radios over TCP (#132), and meshcore-rs's TCP link to reach them.
peoples-chat-fake-radio = { path = "../fake-radio" }
meshcore-rs = { version = "=0.2.0", default-features = false, features = ["tcp"] }
# A Nostr relay inside the test process, as MDK's own tests use.
nostr-relay-builder = "0.44"
# Reads the published events back. The same fork and revision MDK pins.
nostr-sdk = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589" }
serde_json = "1"
tempfile = "3"
# Reads the radio lab's radios.toml in the hardware harness (#133). Tauri already builds it.
toml = "0.8"
# `net` and `io-util` run the test relay's front door (tests/support/relay.rs). `test-util` lets
# the path spike's test (#36) skip the waits it keeps between packets.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "test-util"] }

# The path spike (#36) checks its frames and plan without radios; run its tests with the rest.
[[example]]
name = "path_spike"
test = true

# The radio lab harness (#133, `pnpm verify:radio`) is tested against fake radios.
[[example]]
name = "verify_radio"
test = true
