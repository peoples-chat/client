[package]
name = "peoples-chat-core"
description = "Protocol core of peoples.chat: identity, messaging, radio transports and recovery"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# MDK, the Marmot Development Kit, through its multi-account app runtime. All three come from
# one release tag; Cargo.lock records the commit. Upgrade routine: docs/mdk.md.
marmot-app = { git = "https://github.com/marmot-protocol/mdk", tag = "v0.18.0" }
marmot-account = { git = "https://github.com/marmot-protocol/mdk", tag = "v0.18.0" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", tag = "v0.18.0" }
# Chat ids are MLS group ids in hex.
hex = "0.4"
log = "0.4"
# Reads the relay hints in invite links (NIP-19 nprofile). The same fork and revision MDK pins,
# so it adds nothing to the build.
nostr = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589", default-features = false, features = ["std"] }
# The interface's types travel as JSON (src/interface.rs).
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
# Replaces the OS keychain in tests.
keyring-core = "1"
# A Nostr relay inside the test process, as MDK's own tests use.
nostr-relay-builder = "0.44"
# Reads the published events back. The same fork and revision MDK pins.
nostr-sdk = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589" }
serde_json = "1"
tempfile = "3"
# `net` and `io-util` run the test relay's front door (tests/support/relay.rs).
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
