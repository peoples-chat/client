# Proposed .github/workflows/release.yml (#144). Workers may not edit .github/, so it lives here
# until it is approved and installed; see README.md next to this file.
#
# Builds release artefacts for Android and iOS when a version tag (v1.2.3) is pushed, or by hand.
# Without signing secrets it builds unsigned artefacts; with them it signs, and for iOS uploads to
# TestFlight. Modelled on eddiechat/client's build.yml (commit 69ff084), cut down to the phones and
# to what this repository needs (Odin, the NDK's llvm-ranlib, the committed generated projects).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NDK_VERSION: 29.0.14206865

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release/version.mjs from-tag "$GITHUB_REF_NAME"
      - name: Check the version files agree
        run: echo "VERSION=$(node scripts/release/version.mjs)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          ndk="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # MDK builds OpenSSL from source, which needs the NDK's llvm-ranlib (README, Prerequisites).
          for target in aarch64_linux_android armv7_linux_androideabi i686_linux_android x86_64_linux_android; do
            echo "RANLIB_$target=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> "$GITHUB_ENV"
          done

      # rustup reads the channel from rust-toolchain.toml
      - name: Rust toolchain and Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/odin-archive
          key: odin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: odin-${{ runner.os }}-
      - name: Install Odin for MDK's Markdown parser
        run: ODIN_ARCHIVE_CACHE="$HOME/.cache/odin-archive" scripts/install-odin.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the unsigned release APK and AAB
        run: scripts/release/android.sh

      - name: Sign the APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No Android signing secrets: the artefacts stay unsigned."
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          out=target/release-artifacts
          build_tools="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$build_tools/zipalign" -f -p 4 "$out/peoples-chat-$VERSION-android-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$out/peoples-chat-$VERSION-android.apk" "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$out/peoples-chat-$VERSION-android.aab" \
            "$out/peoples-chat-$VERSION-android-unsigned.aab" "$ANDROID_KEY_ALIAS"
          rm "$keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            target/release-artifacts/*.apk
            target/release-artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release/version.mjs from-tag "$GITHUB_REF_NAME"
      - name: Check the version files agree
        run: echo "VERSION=$(node scripts/release/version.mjs)" >> "$GITHUB_ENV"

      - name: Rust targets for iOS
        run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/odin-archive
          key: odin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: odin-${{ runner.os }}-
      - name: Install Odin for MDK's Markdown parser
        run: ODIN_ARCHIVE_CACHE="$HOME/.cache/odin-archive" scripts/install-odin.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Tauri's `ios build` imports IOS_CERTIFICATE into a temporary keychain and installs
      # IOS_MOBILE_PROVISION when they are set; without them scripts/release/ios.sh builds with
      # --no-sign. The build number makes each TestFlight upload of a version unique.
      - name: Build the IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/release/ios.sh

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ ! -f "target/release-artifacts/peoples-chat-$VERSION-ios.ipa" ]; then
            echo "::warning::No signed IPA or no App Store Connect key: nothing uploaded to TestFlight."
            exit 0
          fi
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY" > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          xcrun altool --upload-app --type ios \
            --file "target/release-artifacts/peoples-chat-$VERSION-ios.ipa" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          rm ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            target/release-artifacts/*.ipa
            target/release-artifacts/*.xcarchive.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # A draft, so a person reads it before anyone can download it.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
