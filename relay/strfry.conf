# strfry configuration for the peoples.chat relay (#90). Settings left out keep strfry's
# defaults. Install as /etc/strfry.conf; setup.sh replaces relay.peoples.chat with the host name.

db = "/var/lib/strfry/"

events {
    # Marmot asks for at least 2 MiB: an invitation to a large group carries the group's state.
    maxEventSize = 2097152
}

relay {
    bind = "127.0.0.1"
    port = 7777
    nofiles = 0
    realIpHeader = "x-forwarded-for"

    # NIP-42. Gift wraps are not restricted to their recipient: strfry 1.1.3 can't, and
    # with strfry's master branch, which can, MDK's invitations didn't arrive (README.md).
    auth {
        enabled = true
        serviceUrl = "wss://relay.peoples.chat"
    }

    info {
        name = "peoples.chat relay"
        description = "Run by peoples.chat. Carries encrypted Marmot messaging events only."
        pubkey = ""
        contact = ""
    }

    # Must be larger than maxEventSize.
    maxWebsocketPayloadSize = 2621440

    writePolicy {
        plugin = "/etc/strfry/write-policy.py"
    }
}
