[workspace]
resolver = "3"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Size-focused release profile from the Tauri guide: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
