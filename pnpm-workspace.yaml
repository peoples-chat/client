# pnpm 12 fails a clean install when a dependency's build script is neither allowed nor refused.
# These come with WebdriverIO and aren't needed: the e2e tests drive the app through its own embedded
# WebDriver server (no Edge or Firefox driver), and esbuild's postinstall only re-checks its binary.
allowBuilds:
  edgedriver: false
  geckodriver: false
  esbuild: false
